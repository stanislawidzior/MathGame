spring.application.name=math-game
# Logging configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:game;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console (useful for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.web.locale=en
spring.web.locale-resolver=accept_header


server.port=8080

# Secret from environment variable
token.signing.key=TrM96hIVhv71JKrd/vfOYYEhTGyF9WcXXvJwcfDQCKw=
token.expiration.time.seconds=86400
