<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Math Game Rooms</title>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="../stomp.js"></script>

    <!-- App logic -->
    <script defer src="game.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
        }

        h1, h2 {
            margin-top: 20px;
        }

        button {
            margin-top: 10px;
            padding: 6px 12px;
            cursor: pointer;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            margin-top: 5px;
            width: 100%;
            padding: 5px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        pre {
            margin-top: 20px;
            background: #f5f5f5;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<h1>Math Game</h1>

<!-- Connect -->
<button id="connectBtn">Connect & Register</button>

<!-- Rooms -->
<h2>Available Rooms</h2>
<ul id="rooms"></ul>

<!-- Create room -->
<h2>Create Room</h2>

<label>
    Question amount:
    <input
            type="number"
            id="questionAmount"
            min="1"
            value="10"
    />
</label>

<label>
    Allowed operations (multi-select):
    <select id="operations" multiple size="4">
        <option value="ADDITION">Addition</option>
        <option value="SUBTRACTION">Subtraction</option>
        <option value="MULTIPLICATION">Multiplication</option>
        <option value="DIVISION">Division</option>
    </select>
</label>

<button id="createRoomBtn">Create Room</button>

<!-- Log -->
<pre id="log"></pre>

</body>
</html>
